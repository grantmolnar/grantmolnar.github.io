name: Desktop bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "scripts/desktop_artifacts.py"
      - "scripts/desktop_build_environment.py"
      - "scripts/verify_desktop_artifacts.py"
      - "src/**"
      - "schemas/desktop-artifact-manifest.schema.json"
      - "tests/unit/test_desktop*.py"
      - "tests/test_package_metadata.py"
      - "tests/test_tooling_configuration.py"
      - "docs/desktop-distribution.md"
      - "pyproject.toml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "scripts/desktop_artifacts.py"
      - "scripts/desktop_build_environment.py"
      - "scripts/verify_desktop_artifacts.py"
      - "src/**"
      - "schemas/desktop-artifact-manifest.schema.json"
      - "tests/unit/test_desktop*.py"
      - "tests/test_package_metadata.py"
      - "tests/test_tooling_configuration.py"
      - "docs/desktop-distribution.md"
      - "pyproject.toml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/desktop-build-requirements.txt

      - name: Install exact desktop build dependencies
        run: |
          python -m pip install -r packaging/desktop-build-requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Build and smoke-test native bundle
        env:
          ADVENTURE_GRAPH_SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/build_desktop.py --output-dir dist/desktop

      - name: Upload bundle and manifest
        uses: actions/upload-artifact@v7
        with:
          name: adventure-graph-${{ matrix.platform }}
          path: dist/desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify:
    name: Verify complete desktop evidence set
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: adventure-graph-*
          path: dist/desktop-evidence
          merge-multiple: true

      - name: Verify archives, manifests, provenance, and platform completeness
        run: >-
          python scripts/verify_desktop_artifacts.py dist/desktop-evidence
          --require-platforms linux windows macos
          --source-revision "${{ github.sha }}"
